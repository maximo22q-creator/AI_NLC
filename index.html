<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой ИИ: Исследователь v2.0</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #05070a; color: #e2e8f0; margin: 0; display: flex; height: 100vh; }
        #left-panel { flex: 1.2; display: flex; flex-direction: column; border-right: 1px solid #1e293b; background: #0a0f18; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; line-height: 1.4; }
        .user { align-self: flex-end; background: #1d4ed8; border: none; }
        .ai { align-self: flex-start; background: #1e293b; }
        #input-bar { padding: 15px; background: #000; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #1e293b; }
        input { background: #0a0f18; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 5px; outline: none; }
        .btn-group { display: flex; gap: 5px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; background: #10b981; color: #000; }
        .red-btn { background: #ef4444; color: white; }
        #right-panel { flex: 1; padding: 20px; background: #000; overflow-y: auto; border-left: 1px solid #1e293b; }
        .stat-box { background: #111; border: 1px solid #334155; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="left-panel">
        <div id="chat">
            <div class="msg ai">Внимание: я очистил мусорные данные. Попробуй дать мне ссылку на статью (лучше Википедию) или просто спроси что-то!</div>
        </div>
        <div id="input-bar">
            <input type="text" id="urlInput" placeholder="Ссылка для обучения (напр. https://ru.wikipedia.org/wiki/V1)">
            <button style="background:#3b82f6; color:white;" onclick="learnFromURL()">ИЗУЧИТЬ СТАТЬЮ</button>
            <hr style="border:0.5px solid #334155; width:100%;">
            <input type="text" id="userInput" placeholder="Кто такой V1?..." onkeydown="if(event.key==='Enter') send()">
            <div class="btn-group">
                <button onclick="send()">СПРОСИТЬ</button>
                <button class="red-btn" onclick="clearBrain()">ОЧИСТИТЬ МОЗГ</button>
            </div>
        </div>
    </div>

    <div id="right-panel">
        <h3>🧠 БАЗА ЗНАНИЙ</h3>
        <div class="stat-box">
            Связей: <b id="fact-count" style="color:#10b981">0</b> | 
            Уровень: <b id="brain-power" style="color:#3b82f6">0</b>
        </div>
        <div id="knowledge-list" style="font-size:11px; color:#94a3b8;"></div>
    </div>

    <script>
        class SmartAI {
            constructor() {
                this.memory = JSON.parse(localStorage.getItem('ai_v2_mem')) || {};
            }

            clean(text) {
                // Список "мусорных" слов от защитных экранов сайтов
                const trash = ["javascript", "cookies", "enable", "forbidden", "access", "denied", "checking", "browser"];
                let words = text.toLowerCase().replace(/[^a-zа-яё0-9\s]/gi, ' ').split(/\s+/).filter(w => w.length > 2);
                
                // Если в тексте слишком много мусора, мы его бракуем
                let trashCount = words.filter(w => trash.includes(w)).length;
                if (trashCount > words.length * 0.3) return []; 
                
                return words;
            }

            train(text) {
                const words = this.clean(text);
                if (words.length < 5) return 0;

                for (let i = 0; i < words.length - 2; i++) {
                    const key = words[i] + ' ' + words[i+1];
                    const target = words[i+2];
                    if (!this.memory[key]) this.memory[key] = {};
                    this.memory[key][target] = (this.memory[key][target] || 0) + 1;
                }
                localStorage.setItem('ai_v2_mem', JSON.stringify(this.memory));
                return words.length;
            }

            generate(input) {
                const words = this.clean(input);
                if (words.length === 0) return "Я тебя не понял. Попробуй написать яснее.";

                let current = words.slice(-2).join(' ');
                if (!this.memory[current]) {
                    const keys = Object.keys(this.memory);
                    current = keys.find(k => k.includes(words[words.length-1])) || keys[Math.floor(Math.random()*keys.length)];
                }

                if (!current) return "Я пока не знаю ничего об этом. Дай мне ссылку на статью!";

                let res = current.split(' ');
                for (let i = 0; i < 35; i++) {
                    const key = res.slice(-2).join(' ');
                    const options = this.memory[key];
                    if (!options) break;
                    const next = Object.entries(options).sort((a,b) => b[1] - a[1])[0][0];
                    if (res.includes(next) && res.length > 10) break; 
                    res.push(next);
                }
                return res.join(' ');
            }
        }

        const ai = new SmartAI();

        async function learnFromURL() {
            const url = document.getElementById('urlInput').value.trim();
            const btn = document.querySelector('button[onclick="learnFromURL()"]');
            btn.innerText = "ЗАГРУЗКА...";
            
            try {
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                doc.querySelectorAll('script, style, nav, footer').forEach(el => el.remove());
                const text = doc.body.innerText;

                const count = ai.train(text);
                if (count === 0) alert("Сайт заблокировал доступ или на нем нет текста. Попробуй другую ссылку.");
                else alert("Обучение завершено! Новых связей: " + count);
                
                updateStats();
            } catch (e) { alert("Ошибка связи с сайтом."); }
            btn.innerText = "ИЗУЧИТЬ СТАТЬЮ";
        }

        function clearBrain() {
            if(confirm("Очистить всю память ИИ?")) {
                localStorage.removeItem('ai_v2_mem');
                ai.memory = {};
                updateStats();
                location.reload();
            }
        }

        async function send() {
            const inp = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const text = inp.value.trim();
            if (!text) return;

            chat.innerHTML += `<div class="msg user">${text}</div>`;
            
            // Если ИИ ничего не знает, пробуем быстрый поиск по Википедии сами
            if (Object.keys(ai.memory).length < 10) {
                const sRes = await fetch(`https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(text)}&format=json&origin=*`);
                const sData = await sRes.json();
                if (sData.query.search[0]) {
                    const pId = sData.query.search[0].pageid;
                    const pRes = await fetch(`https://ru.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext&exintro&pageids=${pId}&format=json&origin=*`);
                    const pData = await pRes.json();
                    ai.train(pData.query.pages[pId].extract);
                }
            }

            const reply = ai.generate(text);
            chat.innerHTML += `<div class="msg ai">${reply}</div>`;
            chat.scrollTop = chat.scrollHeight;
            inp.value = '';
            updateStats();
        }

        function updateStats() {
            const count = Object.keys(ai.memory).length;
            document.getElementById('fact-count').innerText = count;
            document.getElementById('brain-power').innerText = Math.floor(count / 10);
            const list = document.getElementById('knowledge-list');
            list.innerHTML = Object.keys(ai.memory).slice(-5).map(k => `<div>• ${k}</div>`).join('');
        }

        updateStats();
    </script>
</body>
</html>
