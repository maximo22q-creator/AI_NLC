<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Личный Локальный ИИ</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #left-panel { flex: 1.3; display: flex; flex-direction: column; border-right: 1px solid #30363d; background: #0d1117; }
        #chat { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 15px; border: 1px solid #30363d; }
        .user { align-self: flex-end; background: #238636; border: none; }
        .ai { align-self: flex-start; background: #161b22; }
        
        #input-bar { padding: 20px; background: #010409; border-top: 1px solid #30363d; }
        .progress-container { margin-bottom: 10px; display: none; }
        #progress-bar { width: 0%; height: 4px; background: #238636; transition: 0.3s; }
        
        .input-row { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 12px; border-radius: 8px; outline: none; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background: #238636; color: white; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: wait; }

        #right-panel { flex: 0.9; padding: 25px; background: #010409; overflow-y: auto; }
        .slot-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
        .slot-card.active { border: 2px solid #238636; }
        .btn-mini { padding: 4px 8px; font-size: 11px; margin-top: 8px; cursor: pointer; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="left-panel">
        <div id="status" style="padding: 10px 25px; font-size: 12px; color: #8b949e;">Ожидание загрузки мозга...</div>
        <div class="progress-container" id="loader">
            <div id="progress-bar"></div>
        </div>
        
        <div id="chat">
            <div class="msg ai">Я — твой полностью локальный ИИ. Мои мысли не уходят в интернет. <br><br>Когда полоска сверху дойдет до конца, я смогу отвечать!</div>
        </div>

        <div id="input-bar">
            <div class="input-row">
                <input type="text" id="userInput" placeholder="Напиши что-нибудь..." disabled>
                <button id="sendBtn" onclick="send()" disabled>ОТПРАВИТЬ</button>
            </div>
        </div>
    </div>

    <div id="right-panel">
        <h3 style="color:#58a6ff; font-size:14px;">💾 КЭШ-СЛОТЫ (ПРАВИЛА)</h3>
        <div id="cache-list"></div>
        <button onclick="saveCache()" style="background:#8957e5; width:100%; margin-top:10px;" class="btn-mini">СОЗДАТЬ КЭШ ИЗ ВВОДА</button>
    </div>

    <!-- ПОДКЛЮЧАЕМ ЛОКАЛЬНЫЙ ДВИЖОК -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        let generator;
        let db = JSON.parse(localStorage.getItem('local_ai_db')) || {};
        let activeId = localStorage.getItem('local_ai_active') || null;

        // 1. ЗАГРУЗКА ЛОКАЛЬНОЙ МОДЕЛИ (МОЗГА)
        async function loadModel() {
            const progress = document.getElementById('progress-bar');
            const loader = document.getElementById('loader');
            const status = document.getElementById('status');
            
            loader.style.display = 'block';
            
            try {
                // Мы используем самую легкую, но умную модель Qwen 0.5B
                generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat', {
                    progress_callback: (p) => {
                        if(p.status === 'progress') {
                            progress.style.width = p.progress + '%';
                            status.innerText = `Загрузка мозга: ${Math.round(p.progress)}%`;
                        }
                    }
                });
                
                status.innerText = "✅ Мозг загружен локально. Интернет больше не нужен.";
                loader.style.display = 'none';
                document.getElementById('userInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
            } catch (e) {
                status.innerText = "❌ Ошибка загрузки. Возможно, мало памяти.";
            }
        }

        window.send = async () => {
            const inp = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const text = inp.value.trim();
            if(!text) return;

            chat.innerHTML += `<div class="msg user">${text}</div>`;
            inp.value = '';
            
            const aiMsg = document.createElement('div');
            aiMsg.className = 'msg ai';
            aiMsg.innerText = 'Думаю локально...';
            chat.appendChild(aiMsg);
            chat.scrollTop = chat.scrollHeight;

            // Формируем промпт с учетом твоих правил из Кэша
            let systemRule = "Ты - полезный ИИ.";
            if(activeId && db[activeId]) systemRule += " ПРАВИЛО: " + db[activeId].text;
            
            const prompt = `<|im_start|>system\n${systemRule}<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;

            const output = await generator(prompt, {
                max_new_tokens: 100,
                temperature: 0.7,
                do_sample: true,
                top_k: 50,
            });

            const reply = output[0].generated_text.split('assistant\n')[1] || "Я задумался...";
            aiMsg.innerText = reply;
            chat.scrollTop = chat.scrollHeight;
        };

        // Работа с кэшем
        window.saveCache = () => {
            const val = document.getElementById('userInput').value;
            const id = 'ID-' + Math.random().toString(36).substr(2,4).toUpperCase();
            db[id] = { id, text: val };
            localStorage.setItem('local_ai_db', JSON.stringify(db));
            updateUI();
        };

        window.activate = (id) => { activeId = id; localStorage.setItem('local_ai_active', id); updateUI(); };

        function updateUI() {
            const list = document.getElementById('cache-list');
            list.innerHTML = '';
            Object.keys(db).forEach(id => {
                const active = activeId === id;
                list.innerHTML += `<div class="slot-card ${active?'active':''}">
                    <b>${id}</b><br>${db[id].text.substring(0,30)}...
                    <button class="btn-mini" onclick="activate('${id}')">Включить</button>
                </div>`;
            });
        }

        loadModel();
        updateUI();
    </script>
</body>
</html>
