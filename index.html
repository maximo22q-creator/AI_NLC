<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой ИИ: Исследователь Интернета</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #05070a; color: #e2e8f0; margin: 0; display: flex; height: 100vh; }
        
        /* ЧАТ */
        #left-panel { flex: 1.2; display: flex; flex-direction: column; border-right: 1px solid #1e293b; background: #0a0f18; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; line-height: 1.4; }
        .user { align-self: flex-end; background: #1d4ed8; border: none; }
        .ai { align-self: flex-start; background: #1e293b; }
        
        #input-bar { padding: 15px; background: #000; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #1e293b; }
        input { background: #0a0f18; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 5px; outline: none; }
        .btn-group { display: flex; gap: 5px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; background: #10b981; color: #000; }
        .blue-btn { background: #3b82f6; color: white; }

        /* ПАНЕЛЬ ЗНАНИЙ */
        #right-panel { flex: 1; padding: 20px; background: #000; overflow-y: auto; border-left: 1px solid #1e293b; }
        .stat-box { background: #111; border: 1px solid #334155; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        .tag { font-size: 10px; background: #334155; padding: 2px 5px; border-radius: 3px; margin-right: 5px; }
        .knowledge-list { font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

    <div id="left-panel">
        <div id="chat">
            <div class="msg ai">Я готов к обучению. Вставь ссылку на любой сайт ниже, и я изучу его содержимое, чтобы стать умнее!</div>
        </div>
        <div id="input-bar">
            <!-- Поле для ввода любого сайта -->
            <input type="text" id="urlInput" placeholder="Вставь ссылку для обучения (например: https://habr.com/...)">
            <button class="blue-btn" onclick="learnFromURL()">ИЗУЧИТЬ САЙТ</button>
            
            <hr style="border: 0.5px solid #334155; width: 100%;">
            
            <input type="text" id="userInput" placeholder="Твой вопрос..." onkeydown="if(event.key==='Enter') send()">
            <div class="btn-group">
                <button onclick="send()">ОТПРАВИТЬ</button>
                <button style="background:#8b5cf6;" onclick="createShareKey()">КЛЮЧ ДЛЯ ДРУГА</button>
            </div>
        </div>
    </div>

    <div id="right-panel">
        <h3>🧠 БАЗА ЗНАНИЙ ИИ</h3>
        <div class="stat-box">
            Выучено фактов: <b id="fact-count" style="color:#10b981">0</b><br>
            Сложность мозга: <b id="brain-power" style="color:#3b82f6">0</b>
        </div>
        <h4>ПОСЛЕДНИЕ ЗНАНИЯ:</h4>
        <div id="knowledge-list" class="knowledge-list">Здесь появятся факты после обучения...</div>
    </div>

    <script>
        // === НАШ АЛГОРИТМ "СЕМАНТИЧЕСКОЕ ЯДРО" ===
        class SemanticAI {
            constructor() {
                this.memory = JSON.parse(localStorage.getItem('semantic_memory')) || {};
                this.rules = "";
            }

            // Очистка текста от мусора
            clean(text) {
                return text.replace(/<[^>]*>/g, ' ') // Удаляем HTML теги
                           .toLowerCase()
                           .replace(/[^a-zа-яё0-9\s\.\!\?]/gi, ' ')
                           .split(/\s+/)
                           .filter(w => w.length > 2);
            }

            // Обучение: создаем связи между объектами (Триграммы + веса)
            train(text) {
                const words = this.clean(text);
                let count = 0;
                for (let i = 0; i < words.length - 2; i++) {
                    const key = words[i] + ' ' + words[i+1];
                    const target = words[i+2];

                    if (!this.memory[key]) this.memory[key] = {};
                    this.memory[key][target] = (this.memory[key][target] || 0) + 1;
                    count++;
                }
                localStorage.setItem('semantic_memory', JSON.stringify(this.memory));
                return count;
            }

            // Генерация: ищем самый логичный путь в графе знаний
            generate(input) {
                const words = this.clean(input);
                let current = words.slice(-2).join(' ');
                
                // Если мы вообще не знаем этих слов, ищем похожие
                if (!this.memory[current]) {
                    const keys = Object.keys(this.memory);
                    current = keys.find(k => k.includes(words[words.length-1])) || keys[0];
                }

                if (!current) return "Мне нужно больше данных, чтобы ответить на это.";

                let response = current.split(' ');
                let history = new Set();

                for (let i = 0; i < 30; i++) {
                    const key = response.slice(-2).join(' ');
                    if (history.has(key)) break;
                    history.add(key);

                    const options = this.memory[key];
                    if (!options) break;

                    // Берем слово с самым большим весом (самое логичное)
                    const next = Object.entries(options).sort((a,b) => b[1] - a[1])[0][0];
                    response.push(next);
                }

                let final = response.join(' ');
                
                // Применение твоих Кэш-инструкций
                if (this.rules.toLowerCase().includes("мяу")) final += " мяу!";
                
                return final;
            }
        }

        const ai = new SemanticAI();

        // ФУНКЦИЯ ОБУЧЕНИЯ С ЛЮБОГО САЙТА (Через прокси)
        async function learnFromURL() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert("Введи ссылку!");

            const btn = document.querySelector('.blue-btn');
            btn.innerText = "ЧИТАЮ САЙТ...";
            btn.disabled = true;

            try {
                // Используем бесплатный прокси, чтобы обойти защиту сайтов (CORS)
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                // Извлекаем текст из HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                
                // Удаляем скрипты и стили, оставляем только текст
                doc.querySelectorAll('script, style, nav, footer').forEach(el => el.remove());
                const bodyText = doc.body.innerText;

                const factsCount = ai.train(bodyText);
                
                alert(`Успех! ИИ изучил сайт и добавил в память ${factsCount} новых связей.`);
                document.getElementById('urlInput').value = "";
                updateStats();
            } catch (e) {
                alert("Не удалось прочитать сайт. Возможно, он защищен или ссылка неверна.");
            }
            btn.innerText = "ИЗУЧИТЬ САЙТ";
            btn.disabled = false;
        }

        function updateStats() {
            const keys = Object.keys(ai.memory);
            document.getElementById('fact-count').innerText = keys.length;
            document.getElementById('brain-power').innerText = Math.floor(keys.length * 1.5);
            
            const list = document.getElementById('knowledge-list');
            list.innerHTML = keys.slice(-10).map(k => `<div><span class="tag">ФАКТ</span> ${k} -> ...</div>`).join('');
        }

        function send() {
            const inp = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const text = inp.value.trim();
            if (!text) return;

            // Проверка на Ключ от друга
            if (text.startsWith('AI_KEY_')) {
                const decoded = decodeURIComponent(escape(atob(text.replace('AI_KEY_', ''))));
                ai.rules = decoded;
                chat.innerHTML += `<div class="msg ai" style="border-color:#8b5cf6">✅ Ключ принят. Новое правило: "${decoded}"</div>`;
                inp.value = '';
                return;
            }

            chat.innerHTML += `<div class="msg user">${text}</div>`;
            const reply = ai.generate(text);
            
            setTimeout(() => {
                chat.innerHTML += `<div class="msg ai">${reply}</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 300);
            
            inp.value = '';
        }

        function createShareKey() {
            const rule = prompt("Введите инструкцию, которую хотите зашить в ключ (например: Отвечай как робот и говори мяу):");
            if (!rule) return;
            const key = 'AI_KEY_' + btoa(unescape(encodeURIComponent(rule)));
            console.log("Твой ключ:", key);
            alert("Твой Глобальный Ключ (скопируй его из консоли или следующего окна):\n\n" + key);
        }

        updateStats();
    </script>
</body>
</html>
