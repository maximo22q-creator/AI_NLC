<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Автономный ИИ-Агент: Глобальный Поиск</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #05070a; color: #e2e8f0; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* ЛЕВАЯ ПАНЕЛЬ: ЧАТ */
        #left-panel { flex: 1.5; display: flex; flex-direction: column; border-right: 1px solid #1e293b; background: #0a0f18; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 14px; border-radius: 12px; line-height: 1.5; font-size: 15px; border: 1px solid #1e293b; }
        .user { align-self: flex-end; background: #1d4ed8; color: white; border: none; }
        .ai { align-self: flex-start; background: #1e293b; }
        .status-tag { font-size: 10px; color: #10b981; font-family: monospace; margin-bottom: 5px; display: block; }
        
        #input-bar { padding: 20px; background: #000; border-top: 1px solid #1e293b; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; background: #0a0f18; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; outline: none; }
        button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #10b981; color: #000; }
        button:disabled { opacity: 0.5; }

        /* ПРАВАЯ ПАНЕЛЬ: НАСТРОЙКИ */
        #right-panel { flex: 0.8; padding: 20px; background: #000; overflow-y: auto; font-size: 13px; }
        .card { background: #0a0f18; border: 1px solid #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; color: #3b82f6; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .log-entry { font-family: monospace; font-size: 11px; color: #94a3b8; border-bottom: 1px solid #1e293b; padding: 5px 0; }
    </style>
</head>
<body>

    <div id="left-panel">
        <div id="chat">
            <div class="msg ai">
                <b>Автономный режим активирован.</b><br>
                Я — твой агент. Я сам найду информацию в интернете, прочитаю сайты и составлю ответ. <br><br>
                Настрой количество сайтов для анализа справа и задай любой вопрос!
            </div>
        </div>
        <div id="input-bar">
            <input type="text" id="userInput" placeholder="Напиши сложный вопрос..." onkeydown="if(event.key==='Enter') startResearch()">
            <button id="sendBtn" onclick="startResearch()">НАЙТИ И ОТВЕТИТЬ</button>
        </div>
    </div>

    <div id="right-panel">
        <label>⚙️ Глубина исследования</label>
        <div class="card">
            <input type="range" id="depth" min="1" max="10" value="3" style="width:100%">
            <div style="display:flex; justify-content:space-between; margin-top:5px; font-size:10px;">
                <span>Поверхностно (1)</span>
                <span id="depthVal" style="color:#10b981">3 сайта</span>
                <span>Глубоко (10)</span>
            </div>
        </div>

        <label>📡 Журнал работы агента</label>
        <div id="agent-log" class="card" style="height: 300px; overflow-y: auto;">
            Ожидание запроса...
        </div>

        <label>🔗 Изученные источники</label>
        <div id="source-list" class="card" style="font-size:10px; color:#3b82f6"></div>
    </div>

    <script>
        const depthInput = document.getElementById('depth');
        depthInput.oninput = () => document.getElementById('depthVal').innerText = depthInput.value + " сайта";

        function addLog(msg) {
            const log = document.getElementById('agent-log');
            log.innerHTML += `<div class="log-entry">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        // === ГЛАВНАЯ ЛОГИКА АГЕНТА ===
        async function startResearch() {
            const inp = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const chat = document.getElementById('chat');
            const text = inp.value.trim();
            const depth = depthInput.value;

            if(!text) return;

            // Подготовка UI
            chat.innerHTML += `<div class="msg user">${text}</div>`;
            inp.value = '';
            btn.disabled = true;

            const aiMsg = document.createElement('div');
            aiMsg.className = 'msg ai';
            const status = document.createElement('span');
            status.className = 'status-tag';
            aiMsg.appendChild(status);
            const content = document.createElement('div');
            content.innerText = '● ● ●';
            aiMsg.appendChild(content);
            chat.appendChild(aiMsg);
            chat.scrollTop = chat.scrollHeight;

            addLog(`Запуск исследования: "${text}"`);
            let globalContext = "";
            const sources = document.getElementById('source-list');
            sources.innerHTML = "";

            try {
                // ШАГ 1: Поиск информации (используем стабильное API Википедии)
                status.innerText = "🌐 ПОИСК ИСТОЧНИКОВ...";
                const searchRes = await fetch(`https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(text)}&format=json&origin=*`);
                const searchData = await searchRes.json();
                const results = searchData.query.search.slice(0, depth);

                if(results.length === 0) throw new Error("Информации не найдено");

                // ШАГ 2: Чтение сайтов по очереди
                for(let i = 0; i < results.length; i++) {
                    const page = results[i];
                    status.innerText = `📖 ЧИТАЮ САЙТ (${i+1}/${results.length}): ${page.title}`;
                    addLog(`Анализ статьи: ${page.title}`);

                    const pRes = await fetch(`https://ru.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext&exintro&pageids=${page.pageid}&format=json&origin=*`);
                    const pData = await pRes.json();
                    const extract = pData.query.pages[page.pageid].extract;
                    
                    globalContext += `\nИнформация из источника "${page.title}": ${extract}\n`;
                    sources.innerHTML += `<div>• ${page.title}</div>`;
                }

                // ШАГ 3: Генерация умного ответа через облачную нейросеть (без скачивания!)
                status.innerText = "🧠 СИНТЕЗ ИТОГОВОГО ОТВЕТА...";
                addLog("Отправка данных в нейронный центр...");

                const prompt = `Ты — умный помощник. Используй следующие данные для ответа на вопрос пользователя. 
                ДАННЫЕ: ${globalContext}
                ВОПРОС: ${text}
                ОТВЕТ (на русском языке, будь точен):`;

                const aiRes = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai&seed=${Math.floor(Math.random()*999)}`);
                
                if(!aiRes.ok) throw new Error("Сбой нейросети");
                
                const finalAnswer = await aiRes.text();
                content.innerText = finalAnswer;
                status.innerText = `✅ АНАЛИЗ ЗАВЕРШЕН (${results.length} ИСТОЧНИКОВ)`;
                addLog("Ответ успешно сформирован.");

            } catch (e) {
                content.innerText = "Ошибка: не удалось собрать данные или нейросеть занята. Попробуй еще раз.";
                status.innerText = "❌ ОШИБКА";
                addLog(`ОШИБКА: ${e.message}`);
            }

            btn.disabled = false;
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
