<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Самообучающийся ИИ v6.0</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0b0f1a; color: #e2e8f0; margin: 0; display: flex; height: 100vh; }
        #left-panel { flex: 1.3; display: flex; flex-direction: column; border-right: 1px solid #1e293b; background: #0f172a; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 10px; line-height: 1.5; font-size: 15px; }
        .user { align-self: flex-end; background: #2563eb; color: white; }
        .ai { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
        #input-bar { padding: 15px; background: #0b1120; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #1e293b; }
        .controls { display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
        button { padding: 10px 15px; border-radius: 8px; border: none; background: #10b981; color: white; font-weight: bold; cursor: pointer; }
        .reset-btn { background: #ef4444; }
        
        #right-panel { flex: 1; padding: 20px; background: #020617; overflow-y: auto; font-size: 13px; }
        .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        .stat-val { color: #10b981; font-weight: bold; font-size: 18px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; }
        input[type="range"] { width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div id="left-panel">
        <div id="chat">
            <div class="msg ai">Я готов к работе. Моя база знаний загружена. Теперь я запоминаю всё навсегда!</div>
        </div>
        <div id="input-bar">
            <div class="slider-label">
                <span>Логика (Робот)</span>
                <span>Творчество (Писатель)</span>
            </div>
            <input type="range" id="tempSlider" min="0" max="100" value="20">
            <div class="controls">
                <input type="text" id="userInput" placeholder="Напиши что-нибудь..." onkeydown="if(event.key==='Enter') startProcess()">
                <button onclick="startProcess()">Сказать</button>
                <button class="reset-btn" onclick="clearMemory()">Забыть всё</button>
            </div>
        </div>
    </div>

    <div id="right-panel">
        <div style="color: #38bdf8; font-weight: bold; margin-bottom: 8px;">📊 Статистика ИИ:</div>
        <div class="card">
            Связей в мозгу: <span id="brain-size" class="stat-val">0</span><br>
            Прочитано статей: <span id="articles-count" class="stat-val">0</span>
        </div>

        <div style="color: #38bdf8; font-weight: bold; margin-bottom: 8px;">🧠 Анализ текущего ответа:</div>
        <div id="brain-log" class="card">Жду диалога...</div>
    </div>

    <script>
        class PersistentBrain {
            constructor() {
                // Загружаем память из браузера
                this.network = JSON.parse(localStorage.getItem('ai_global_memory')) || {};
                this.articlesCount = parseInt(localStorage.getItem('ai_articles_count')) || 0;
                this.updateStats();
            }

            tokenize(text) {
                return text.toLowerCase().replace(/[^a-zа-яё0-9\s]/gi, ' ').split(/\s+/).filter(w => w.length > 1);
            }

            train(text) {
                const words = this.tokenize(text);
                for (let i = 0; i < words.length - 2; i++) {
                    const key = words[i] + ' ' + words[i+1];
                    const next = words[i+2];
                    if (!this.network[key]) this.network[key] = {};
                    this.network[key][next] = (this.network[key][next] || 0) + 1;
                }
                this.save();
            }

            save() {
                localStorage.setItem('ai_global_memory', JSON.stringify(this.network));
                localStorage.setItem('ai_articles_count', this.articlesCount);
                this.updateStats();
            }

            updateStats() {
                document.getElementById('brain-size').innerText = Object.keys(this.network).length;
                document.getElementById('articles-count').innerText = this.articlesCount;
            }

            generate(seed, temperature) {
                const words = this.tokenize(seed);
                const keys = Object.keys(this.network);
                let starter = keys.find(k => k.includes(words[words.length-1])) || keys[Math.floor(Math.random() * keys.length)];

                if (!starter) return "Я пока мало что знаю. Обучи меня!";

                let [w1, w2] = starter.split(' ');
                let result = [w1, w2];
                let log = [];

                for (let i = 0; i < 25; i++) {
                    const key = w1 + ' ' + w2;
                    const nexts = this.network[key];
                    if (!nexts) break;

                    const sorted = Object.entries(nexts).sort((a,b) => b[1] - a[1]);
                    
                    // ЛОГИКА TEMPERATURE (Творчество)
                    let chosen;
                    if (Math.random() * 100 > temperature) {
                        chosen = sorted[0][0]; // Самое вероятное
                    } else {
                        chosen = sorted[Math.floor(Math.random() * sorted.length)][0]; // Случайное из возможных
                    }

                    result.push(chosen);
                    w1 = w2; w2 = chosen;
                    if (result.length > 5 && (chosen === "." || i === 24)) break;
                }
                return result.join(' ');
            }
        }

        const brain = new PersistentBrain();

        function clearMemory() {
            if(confirm("ИИ полностью потеряет все знания. Уверен?")) {
                localStorage.clear();
                location.reload();
            }
        }

        async function startProcess() {
            const inp = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const temp = document.getElementById('tempSlider').value;
            const text = inp.value.trim();
            if (!text) return;

            chat.innerHTML += `<div class="msg user">${text}</div>`;
            inp.value = '';

            const aiMsg = document.createElement('div');
            aiMsg.className = 'msg ai';
            aiMsg.innerText = '● ● ●';
            chat.appendChild(aiMsg);
            chat.scrollTop = chat.scrollHeight;

            try {
                // Ищем инфу
                const sRes = await fetch(`https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(text)}&format=json&origin=*`);
                const sData = await sRes.json();
                
                if (sData.query.search.length > 0) {
                    const winner = sData.query.search[0];
                    const pRes = await fetch(`https://ru.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext&exintro&titles=${encodeURIComponent(winner.title)}&format=json&origin=*`);
                    const pData = await pRes.json();
                    const pages = pData.query.pages;
                    const content = pages[Object.keys(pages)[0]].extract;

                    brain.train(content);
                    brain.articlesCount++;
                    brain.save();
                }

                // Учимся на фразе пользователя тоже!
                brain.train(text);

                // Отвечаем
                const reply = brain.generate(text, temp);
                aiMsg.innerText = reply.charAt(0).toUpperCase() + reply.slice(1) + ".";

            } catch (e) {
                aiMsg.innerText = "Я не смог подключиться к интернету, но ответил из памяти: " + brain.generate(text, temp);
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
