<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой ИИ: Исправленный Калькулятор</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #05070a; color: #e2e8f0; margin: 0; display: flex; height: 100vh; }
        #left-panel { flex: 1.2; display: flex; flex-direction: column; border-right: 1px solid #1e293b; background: #0a0f18; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; line-height: 1.4; }
        .user { align-self: flex-end; background: #1d4ed8; border: none; }
        .ai { align-self: flex-start; background: #1e293b; }
        .math-badge { color: #10b981; font-size: 11px; font-weight: bold; display: block; margin-bottom: 4px; }
        #input-bar { padding: 15px; background: #000; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #1e293b; }
        input { background: #0a0f18; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 5px; outline: none; }
        button { padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; background: #10b981; color: #000; }
        #right-panel { flex: 1; padding: 20px; background: #000; border-left: 1px solid #1e293b; font-size: 13px; }
        .card { background: #111; border: 1px solid #334155; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="left-panel">
        <div id="chat">
            <div class="msg ai">Я обновил математический модуль! Теперь я понимаю 2+2 без пробелов и смесь цифр со словами. Попробуй!</div>
        </div>
        <div id="input-bar">
            <input type="text" id="userInput" placeholder="2+2, 7 плюс 14..." onkeydown="if(event.key==='Enter') send()">
            <button onclick="send()">СПРОСИТЬ</button>
        </div>
    </div>

    <div id="right-panel">
        <h3>🧠 СТАТУС СИСТЕМЫ</h3>
        <div class="card">
            Математика: <b style="color:#10b981">УЛЬТРА-РЕЖИМ</b><br>
            Текстовая база: <b id="fact-count" style="color:#3b82f6">0</b> связей
        </div>
        <div style="color:#94a3b8; font-size: 11px;">
            ИИ сначала ищет числа и знаки. Если находит — блокирует текстовый мозг, чтобы не нести чепуху.
        </div>
    </div>

    <script>
        class MathEngine {
            constructor() {
                this.numWords = {
                    'ноль':0,'один':1,'два':2,'три':3,'четыре':4,'пять':5,'шесть':6,'семь':7,'восемь':8,'девять':9,'десять':10,
                    'одиннадцать':11,'двенадцать':12,'тринадцать':13,'четырнадцать':14,'пятнадцать':15,'двадцать':20,'тридцать':30,'сорок':40,'сто':100
                };
                this.ops = { 'плюс':'+','глюс':'+','минус':'-','умножить':'*','на':'*','разделить':'/','делить':'/' };
            }

            // Ультра-детектор математики
            isMath(text) {
                const t = text.toLowerCase();
                // Если есть цифра и рядом знак (2+2, 5-1)
                if (/[0-9]\s*[\+\-\*\/x×÷:]\s*[0-9]/.test(t)) return true;
                // Если есть слова-числа или цифры и слова-операции (7 плюс 14)
                const tokens = t.split(/[\s\+\-\*\/x×÷:]+/);
                let hasNum = /[0-9]/.test(t);
                for(let word in this.numWords) if(t.includes(word)) hasNum = true;
                let hasOp = false;
                for(let op in this.ops) if(t.includes(op)) hasOp = true;
                if(/[\+\-\*\/]/.test(t)) hasOp = true;
                
                return hasNum && hasOp;
            }

            solve(text) {
                try {
                    // 1. Заменяем слова-операции на знаки
                    let prepared = text.toLowerCase();
                    for(let op in this.ops) prepared = prepared.split(op).join(this.ops[op]);
                    
                    // 2. Заменяем слова-цифры на реальные цифры
                    for(let word in this.numWords) prepared = prepared.split(word).join(this.numWords[word]);

                    // 3. Чистим всё кроме цифр и знаков
                    prepared = prepared.replace(/[^0-9\+\-\*\/\.]/g, ' ');
                    
                    // 4. Считаем результат (безопасно через Function)
                    // Убираем лишние пробелы и считаем
                    const expression = prepared.replace(/\s+/g, '');
                    const result = new Function(`return ${expression}`)();
                    
                    if (typeof result !== 'number' || isNaN(result)) return null;
                    return `🧮 ${text.trim()} = ${Math.round(result * 100) / 100}`;
                } catch (e) { return null; }
            }
        }

        class TextBrain {
            constructor() {
                this.memory = JSON.parse(localStorage.getItem('ai_v2_mem')) || {};
            }
            train(text) {
                let words = text.toLowerCase().replace(/[^a-zа-яё0-9\s]/gi, ' ').split(/\s+/).filter(w => w.length > 2);
                for (let i = 0; i < words.length - 2; i++) {
                    const key = words[i] + ' ' + words[i+1];
                    const target = words[i+2];
                    if (!this.memory[key]) this.memory[key] = {};
                    this.memory[key][target] = (this.memory[key][target] || 0) + 1;
                }
                localStorage.setItem('ai_v2_mem', JSON.stringify(this.memory));
            }
            generate(input) {
                let words = input.toLowerCase().replace(/[^a-zа-яё0-9\s]/gi, ' ').split(/\s+/).filter(w => w.length > 2);
                let current = words.slice(-2).join(' ');
                const keys = Object.keys(this.memory);
                if (!this.memory[current]) current = keys.find(k => k.includes(words[words.length-1])) || keys[Math.floor(Math.random()*keys.length)];
                if (!current) return "Я пока не знаю, что ответить.";
                let res = current.split(' ');
                for (let i = 0; i < 20; i++) {
                    const key = res.slice(-2).join(' ');
                    if (!this.memory[key]) break;
                    const next = Object.entries(this.memory[key]).sort((a,b) => b[1] - a[1])[0][0];
                    res.push(next);
                }
                return res.join(' ');
            }
        }

        const math = new MathEngine();
        const ai = new TextBrain();

        async function send() {
            const inp = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const text = inp.value.trim();
            if (!text) return;

            chat.innerHTML += `<div class="msg user">${text}</div>`;
            inp.value = '';

            // Сначала жесткая проверка на математику
            if (math.isMath(text)) {
                const res = math.solve(text);
                if (res) {
                    chat.innerHTML += `<div class="msg ai"><span class="math-badge">ИНСТРУМЕНТ: КАЛЬКУЛЯТОР</span>${res}</div>`;
                } else {
                    chat.innerHTML += `<div class="msg ai"><span class="math-badge">ОШИБКА МАТЕМАТИКИ</span>Я вижу, что это пример, но не могу его разобрать. Пиши проще, например: 7 + 14</div>`;
                }
            } else {
                // Если не математика — обычный мозг
                const reply = ai.generate(text);
                chat.innerHTML += `<div class="msg ai"><span class="math-badge" style="color:#3b82f6">ИНСТРУМЕНТ: ТЕКСТОВЫЙ МОЗГ</span>${reply}</div>`;
            }
            
            chat.scrollTop = chat.scrollHeight;
            document.getElementById('fact-count').innerText = Object.keys(ai.memory).length;
        }

        document.getElementById('fact-count').innerText = Object.keys(ai.memory).length;
    </script>
</body>
</html>
