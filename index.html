<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Автономный ИИ-Агент: Глобальный Поиск</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #05070a; color: #e2e8f0; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* ЛЕВАЯ ПАНЕЛЬ: ЧАТ */
        #left-panel { flex: 1.5; display: flex; flex-direction: column; border-right: 1px solid #1e293b; background: #0a0f18; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 14px; border-radius: 12px; line-height: 1.5; font-size: 15px; border: 1px solid #1e293b; white-space: pre-wrap; word-break: break-word; }
        .msg a { color: #60a5fa; }
        .user { align-self: flex-end; background: #1d4ed8; color: white; border: none; }
        .ai { align-self: flex-start; background: #1e293b; }
        .status-tag { font-size: 10px; color: #10b981; font-family: monospace; margin-bottom: 5px; display: block; }

        #input-bar { padding: 20px; background: #000; border-top: 1px solid #1e293b; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; background: #0a0f18; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; outline: none; }
        button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #10b981; color: #000; }
        button:disabled { opacity: 0.5; }
        button.ghost { background: #1e293b; color: #e2e8f0; }

        /* ПРАВАЯ ПАНЕЛЬ: НАСТРОЙКИ */
        #right-panel { flex: 0.8; padding: 20px; background: #000; overflow-y: auto; font-size: 13px; }
        .card { background: #0a0f18; border: 1px solid #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; color: #3b82f6; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .log-entry { font-family: monospace; font-size: 11px; color: #94a3b8; border-bottom: 1px solid #1e293b; padding: 5px 0; }
        #source-list a { color: #3b82f6; text-decoration: none; display: block; padding: 2px 0; }
        #source-list a:hover { text-decoration: underline; }
        #memory-stats { font-family: monospace; font-size: 11px; color: #94a3b8; line-height: 1.7; }
    </style>
</head>
<body>

    <div id="left-panel">
        <div id="chat"></div>
        <div id="input-bar">
            <input type="text" id="userInput" placeholder="Напиши сложный вопрос... (я помню наш разговор)">
            <button id="sendBtn">НАЙТИ И ОТВЕТИТЬ</button>
            <button id="stopBtn" class="ghost" style="display:none">СТОП</button>
        </div>
    </div>

    <div id="right-panel">
        <label>⚙️ Глубина исследования</label>
        <div class="card">
            <input type="range" id="depth" min="1" max="10" value="3" style="width:100%">
            <div style="display:flex; justify-content:space-between; margin-top:5px; font-size:10px;">
                <span>Поверхностно (1)</span>
                <span id="depthVal" style="color:#10b981">3 сайта</span>
                <span>Глубоко (10)</span>
            </div>
        </div>

        <label>🧠 Память диалога</label>
        <div class="card">
            <div id="memory-stats">Сообщений в памяти: 0</div>
            <button id="clearMemoryBtn" class="ghost" style="margin-top:10px; width:100%">🗑 Забыть всё (новый диалог)</button>
        </div>

        <label>📡 Журнал работы агента</label>
        <div id="agent-log" class="card" style="height: 300px; overflow-y: auto;">
            Ожидание запроса...
        </div>

        <label>🔗 Изученные источники</label>
        <div id="source-list" class="card" style="font-size:10px; color:#3b82f6"></div>
    </div>

    <script>
    'use strict';
    /* =====================================================================
       ЧТО БЫЛО СЛОМАНО (эффект «деменции») И КАК ИСПРАВЛЕНО:
       1. Памяти не было вообще: каждый запрос уходил в модель как первый
          в жизни. -> Теперь отправляется история диалога, старые реплики
          сжимаются в краткую сводку, всё хранится в localStorage.
       2. Контекст пихался в URL GET-запроса и молча обрывался по лимиту
          длины URL. -> Теперь POST с JSON-телом (OpenAI-формат).
       3. Случайный seed на каждый запрос -> убран, temperature снижена.
       4. Читался только 1-й абзац статьи, поиск шёл дословно по вопросу
          («Когда родился...?»). -> Из вопроса вырезаются ключевые слова,
          из статей выбираются самые релевантные предложения, уточняющие
          вопросы («а когда он родился?») разрешаются через историю.
       5. Не было системного промпта -> модель выдумывала факты.
          Теперь: отвечать по источникам, ссылаться [1], [2]..., честно
          говорить «не знаю», не противоречить истории диалога.
       ===================================================================== */

    // ---------- Константы ----------
    const AI_ENDPOINT = 'https://text.pollinations.ai/openai';
    const AI_MODEL = 'openai';
    const STORE_KEY = 'ai_nlc_memory_v2';
    const MAX_RECENT_TURNS = 8;       // сколько последних реплик держать дословно
    const SUMMARIZE_AFTER = 14;       // после скольких сообщений сжимать старое в сводку
    const MAX_CHARS_PER_SOURCE = 1400; // релевантный фрагмент на источник (не вся статья!)
    const MAX_CONTEXT_CHARS = 7000;    // общий лимит контекста из источников
    const REQUEST_TIMEOUT_MS = 90000;

    const SYSTEM_PROMPT = [
        'Ты — умный русскоязычный помощник-исследователь с памятью диалога.',
        'Правила:',
        '1. Отвечай точно и по существу, на русском языке.',
        '2. Помни всё, что обсуждалось раньше в этом диалоге (история и сводка ниже). Никогда не говори, что не помнишь предыдущие сообщения, если они есть в контексте. Уточняющие вопросы («а он?», «а когда?») относятся к теме из истории.',
        '3. Если даны ИСТОЧНИКИ — опирайся прежде всего на них и ставь ссылки вида [1], [2] после соответствующих фактов.',
        '4. Не выдумывай факты, даты и цифры. Если в источниках и истории ответа нет — честно скажи, что не нашёл, и предложи, как можно уточнить запрос.',
        '5. Не противоречь сам себе и ранее сказанному в диалоге. Если пользователь указывает на твою ошибку — признай и исправь.',
        '6. Структурируй длинные ответы: короткий вывод, затем детали. Без воды.'
    ].join('\n');

    // Стоп-слова: выбрасываются из поискового запроса и при оценке релевантности
    const STOPWORDS = new Set(('что кто где когда почему зачем как какой какая какие какого кому чему кого ' +
        'расскажи расскажите объясни объясните напиши скажи скажите подскажи есть был была были будет ' +
        'это этот эта эти про для или при над под без из в во на не ни же ли бы а и у с со к о об от до по за ' +
        'мне меня тебе мне пожалуйста можно нужно надо узнать хочу знает значит является ли ты вы он она они оно мы').split(/\s+/));

    // ---------- Состояние / память ----------
    let history = [];        // [{role:'user'|'assistant', content:'...'}]
    let summary = '';        // сжатая сводка старой части диалога
    let abortCtrl = null;

    const chatEl = document.getElementById('chat');
    const inp = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const depthInput = document.getElementById('depth');
    const sourcesEl = document.getElementById('source-list');

    depthInput.oninput = () => document.getElementById('depthVal').innerText = depthInput.value + ' сайта';
    btn.onclick = startResearch;
    stopBtn.onclick = () => abortCtrl && abortCtrl.abort();
    inp.onkeydown = e => { if (e.key === 'Enter') startResearch(); };
    document.getElementById('clearMemoryBtn').onclick = () => {
        history = []; summary = '';
        saveMemory(); renderAll(); addLog('Память очищена. Начат новый диалог.');
    };

    function saveMemory() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify({ history, summary })); } catch (e) { /* переполнено — не критично */ }
        updateMemoryStats();
    }
    function loadMemory() {
        try {
            const raw = localStorage.getItem(STORE_KEY);
            if (!raw) return;
            const data = JSON.parse(raw);
            if (Array.isArray(data.history)) history = data.history.filter(m => m && m.content);
            if (typeof data.summary === 'string') summary = data.summary;
        } catch (e) { /* битый JSON — начинаем с чистого листа */ }
    }
    function updateMemoryStats() {
        document.getElementById('memory-stats').innerHTML =
            'Сообщений в памяти: ' + history.length + '<br>' +
            'Сводка старой части: ' + (summary ? 'есть (' + summary.length + ' симв.)' : 'нет') + '<br>' +
            'Память переживает перезагрузку страницы ✔';
    }

    // ---------- UI ----------
    function addLog(msg) {
        const log = document.getElementById('agent-log');
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    // Пузырь сообщения. textContent (а не innerHTML) — защита от поломки
    // вёрстки и XSS через ввод пользователя / ответ модели.
    function addBubble(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
        if (role === 'user') {
            div.textContent = text;
        } else {
            const st = document.createElement('span');
            st.className = 'status-tag';
            st.textContent = '🤖 АГЕНТ';
            const body = document.createElement('div');
            renderMarkdown(body, text);
            div.append(st, body);
            div._status = st; div._body = body;
        }
        chatEl.appendChild(div);
        chatEl.scrollTop = chatEl.scrollHeight;
        return div;
    }

    function renderAll() {
        chatEl.innerHTML = '';
        if (history.length === 0) {
            addBubble('assistant',
                'Автономный режим активирован.\n' +
                'Я — твой агент с памятью: помню наш разговор (даже после перезагрузки), сам нахожу информацию в интернете, читаю сайты и составляю ответ со ссылками на источники.\n\n' +
                'Задай вопрос, а потом попробуй уточнить: «а подробнее?», «а когда это было?» — я пойму, о чём речь.');
        } else {
            history.forEach(m => addBubble(m.role, m.content));
            addLog('Восстановлен диалог из памяти: ' + history.length + ' сообщений.');
        }
        updateMemoryStats();
    }

    // ---------- Поиск: умные ключевые слова вместо дословного вопроса ----------
    function keywords(text) {
        return [...new Set(
            text.toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, ' ')
                .split(/\s+/)
                .filter(w => w.length > 2 && !STOPWORDS.has(w))
        )];
    }

    // Уточняющий вопрос («а когда он родился?») сам по себе ничего не ищется.
    // Подмешиваем ключевые слова из последних реплик — поиск по теме диалога.
    function buildSearchQuery(text) {
        let words = keywords(text);
        const isFollowUp = words.length < 3 || /^(а|и|но)\b|^(он|она|оно|они|это|тот|та|там|туда|потом|дальше)\b/i.test(text.trim());
        if (isFollowUp && history.length) {
            const past = keywords(history.filter(m => m.role === 'user').slice(-3).map(m => m.content).join(' '));
            words = [...new Set([...past.slice(0, 5), ...words])];
            if (past.length) addLog('Уточняющий вопрос — расширил запрос темой из истории: «' + words.join(' ') + '»');
        }
        return words.join(' ') || text;
    }

    // Из полной статьи выбираем предложения, реально относящиеся к вопросу,
    // а не только первый абзац, как раньше.
    function pickRelevantSentences(fullText, keys, limitChars) {
        if (!fullText) return '';
        const clean = fullText.replace(/\s+/g, ' ').trim();
        if (clean.length <= limitChars) return clean;
        const sentences = clean.match(/[^.!?…]+[.!?…]+/g) || [clean];
        const scored = sentences.map((s, i) => {
            const low = s.toLowerCase();
            let score = keys.reduce((acc, k) => acc + (low.includes(k) ? 1 : 0), 0);
            if (i === 0) score += 0.5; // первый абзац обычно содержит определение
            return { s: s.trim(), score, i };
        });
        const top = scored.filter(x => x.score > 0)
            .sort((a, b) => b.score - a.score)
            .slice(0, 12)
            .sort((a, b) => a.i - b.i); // вернуть исходный порядок предложений
        let out = '';
        for (const x of top) {
            if (out.length + x.s.length > limitChars) break;
            out += x.s + ' ';
        }
        return (out || clean.slice(0, limitChars)).trim();
    }

    /* ---------- Понимание намерения (intent) ----------
       Раньше ЛЮБОЕ сообщение летело в поиск: на «Привет» агент честно
       читал 3 статьи Википедии про посёлок Привет и подвесные моторы.
       Теперь сначала классифицируем, ЧТО человек вообще хочет:
         chat      — приветствие/болтовня/благодарность: поиск НЕ нужен
         memory    — вопрос о самом диалоге («помнишь?»): поиск НЕ нужен
         reasoning — загадка/математика/творчество/код: думаем сами, без поиска
         research  — нужны внешние факты: только тогда идём в интернет
       Приветствие + вопрос («Привет, кто такой Хагги Вагги?») разрезаем:
       здороваемся, но ищем именно вопрос. */
    function detectIntent(raw) {
        let t = raw.trim();
        const low = t.toLowerCase().replace(/\s+/g, ' ');

        // Отрезаем приветствие в начале, если после него есть настоящий вопрос
        let greeting = false;
        const gm = low.match(/^(привет+|здравствуй(?:те)?|добрый (?:день|вечер)|доброе утро|хай|хеллоу|салют|ку)[!.,\s]+(.+)$/);
        if (gm && gm[2].length > 4) { greeting = true; t = gm[2]; }
        const clean = (greeting ? t.toLowerCase() : low).replace(/[!?….,\s]+$/g, '').trim();

        const pure = [
            ['greeting', /^(привет+|здравствуй(?:те)?|добрый (?:день|вечер)|доброе утро|доброй ночи|хай|хеллоу|салют|ку|здорово|приветствую)( всем| всем привет)?$/],
            ['greeting', /^(как дела|как ты|как жизнь|что делаешь|ты тут|ты кто|кто ты|что ты умеешь|что ты можешь|представься)$/],
            ['thanks',   /^(спасибо|благодарю|благодарствую|спс|мерси|thanks|thank you)( большое| огромное| тебе)?$/],
            ['bye',      /^(пока|до свидания|до встречи|прощай|бай|увидимся|я пош[её]л|мне пора)$/],
            ['ack',      /^(ок|окей|хорошо|понял[а]?|понятно|ясно|ладно|договорились|круто|класс|молодец|отлично|супер|ага|угу|да|нет|норм)$/],
        ];
        for (const [type, re] of pure) if (re.test(clean)) return { type, needsSearch: false, searchText: t, greeting };

        if (/помнишь|мы (уже )?(обсуждали|говорили)|я (тебе )?(говорил|сказал|писал|спрашивал)|что я (спрашивал|говорил)|о ч[её]м мы/.test(low))
            return { type: 'memory', needsSearch: false, searchText: t, greeting };

        // Загадки, логика, творчество, перевод, код — тут Википедия только мешает
        // (старый баг: загадка про Python падала с «информации не найдено»)
        if (/загадк|отгадай|угадай|сколько будет|посчитай|вычисли|реши (пример|задачу|уравнение)|придумай|сочини|напиши (стих|рассказ|шутку|анекдот|код|программу|функцию|скрипт)|переведи|анекдот|пошути|что (ты )?думаешь|тво[её] мнение/.test(low)
            || /^[\d\s+\-*/().=xх]+$/.test(clean))
            return { type: 'reasoning', needsSearch: false, searchText: t, greeting };

        // Явный запрос фактов из внешнего мира
        if (/кто (такой|такая|это)|что такое|когда (родился|родилась|был[ао]?|произошл|основал|умер)|в каком году|где (находится|родился|жив[её]т)|сколько лет|расскажи (о|про|об)|найди|поищи|загугли|новости|погода|курс (валют|доллара|евро)|цена|что (это|значит)|объясни (что|кто|как работает)/.test(low))
            return { type: 'research', needsSearch: true, searchText: t, greeting };

        // Фолбэк: похоже на фактический вопрос — ищем; короткая реплика — просто болтаем
        const kw = keywords(t);
        return kw.length >= 2 && (t.includes('?') || kw.length >= 4)
            ? { type: 'research', needsSearch: true, searchText: t, greeting }
            : { type: 'chat', needsSearch: false, searchText: t, greeting };
    }
    const INTENT_LABEL = { greeting: '👋 приветствие', thanks: '🙏 благодарность', bye: '👋 прощание', ack: '💬 реакция', chat: '💬 просто разговор', memory: '🧠 вопрос о памяти диалога', reasoning: '🤔 загадка/рассуждение — думаю сам', research: '🔎 нужны факты — иду в интернет' };

    async function fetchWikiContext(query, originalText, depth, signal) {
        const searchRes = await fetch('https://ru.wikipedia.org/w/api.php?action=query&list=search&srnamespace=0&srlimit=' +
            depth + '&srsearch=' + encodeURIComponent(query) + '&format=json&origin=*', { signal });
        if (!searchRes.ok) throw new Error('Поиск недоступен (HTTP ' + searchRes.status + ')');
        const results = (await searchRes.json()).query?.search || [];
        if (!results.length) return { context: '', sources: [] };

        // Все статьи одним запросом, полный текст (а не только вступление)
        const ids = results.map(r => r.pageid).join('|');
        const pRes = await fetch('https://ru.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext&exlimit=max&pageids=' +
            ids + '&format=json&origin=*', { signal });
        const pages = (await pRes.json()).query?.pages || {};
        const keys = keywords(originalText + ' ' + query);

        let context = '', used = [];
        for (const page of results) {
            if (context.length >= MAX_CONTEXT_CHARS) break;
            const extract = pickRelevantSentences(pages[page.pageid]?.extract || '', keys, MAX_CHARS_PER_SOURCE);
            if (!extract) continue;
            const n = used.length + 1;
            context += '\n\n[' + n + '] Источник: «' + page.title + '»\n' + extract;
            used.push({ n, title: page.title, url: 'https://ru.wikipedia.org/?curid=' + page.pageid });
        }
        return { context, sources: used };
    }

    // ---------- Вызов модели: POST + JSON (контекст больше не режется лимитом URL) ----------
    async function callAI(messages, signal) {
        let lastErr;
        for (let attempt = 1; attempt <= 3; attempt++) {
            try {
                const res = await fetch(AI_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: AI_MODEL,
                        messages,
                        temperature: 0.3,   // фактология, а не творчество
                        // seed НЕ случайный: раньше из-за него ответы «прыгали»
                    }),
                    signal
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const text = data.choices?.[0]?.message?.content?.trim();
                if (!text) throw new Error('Пустой ответ модели');
                return text;
            } catch (e) {
                if (e.name === 'AbortError') throw e;
                lastErr = e;
                addLog('Попытка ' + attempt + '/3 не удалась: ' + e.message);
                if (attempt < 3) await new Promise(r => setTimeout(r, 1200 * attempt));
            }
        }
        throw lastErr || new Error('Сбой нейросети');
    }

    // Старые реплики не выбрасываем (это и была «деменция»), а сжимаем в сводку
    async function maybeSummarize(signal) {
        if (history.length <= SUMMARIZE_AFTER) return;
        const old = history.slice(0, history.length - MAX_RECENT_TURNS);
        const recent = history.slice(-MAX_RECENT_TURNS);
        addLog('Сжимаю старую часть диалога в сводку (' + old.length + ' сообщений)…');
        try {
            const packed = await callAI([
                { role: 'system', content: 'Сожми диалог в краткую фактическую сводку на русском: имена, темы, факты, договорённости, нерешённые вопросы. Без воды, до 120 слов.' },
                { role: 'user', content: (summary ? 'Предыдущая сводка:\n' + summary + '\n\n' : '') +
                    'Диалог:\n' + old.map(m => (m.role === 'user' ? 'Пользователь: ' : 'Ассистент: ') + m.content).join('\n') }
            ], signal);
            summary = packed;
            history = recent;
            saveMemory();
            addLog('Сводка обновлена, память не потеряна.');
        } catch (e) {
            addLog('Не удалось сжать историю (' + e.message + ') — просто обрежу самые старые реплики.');
            history = recent;
            saveMemory();
        }
    }

    // ---------- Главная логика ----------
    async function startResearch() {
        const text = inp.value.trim();
        if (!text || btn.disabled) return;
        inp.value = '';
        btn.disabled = true;
        stopBtn.style.display = '';
        abortCtrl = new AbortController();
        const timeout = setTimeout(() => abortCtrl.abort(), REQUEST_TIMEOUT_MS);
        const signal = abortCtrl.signal;

        addBubble('user', text);
        const aiMsg = addBubble('assistant', '● ● ●');
        const status = aiMsg._status, content = aiMsg._body;
        const setStatus = s => { status.textContent = s; chatEl.scrollTop = chatEl.scrollHeight; };

        addLog('Запрос: "' + text + '" (в памяти уже ' + history.length + ' сообщений)');
        sourcesEl.innerHTML = '';

        try {
            // ШАГ 0: понять намерение. «Привет» — это НЕ тема для исследования 🙂
            const intent = detectIntent(text);
            addLog('Намерение: ' + (INTENT_LABEL[intent.type] || intent.type) + (intent.greeting ? ' (+ приветствие в начале)' : ''));

            // ШАГ 1: в интернет идём только если реально нужны внешние факты
            let context = '', usedSources = [];
            if (!intent.needsSearch) {
                setStatus(intent.type === 'memory' ? '🧠 СМОТРЮ ИСТОРИЮ ДИАЛОГА...' : '💬 ПОНЯЛ, ЭТО НЕ ЗАПРОС НА ПОИСК — ОТВЕЧАЮ САМ...');
                addLog('Поиск пропущен: намерение «' + intent.type + '» не требует интернета.');
            } else {
                setStatus('🌐 ИЩУ ИСТОЧНИКИ...');
                const query = buildSearchQuery(intent.searchText);
                addLog('Поисковый запрос: «' + query + '»');
                const found = await fetchWikiContext(query, intent.searchText, Number(depthInput.value), signal);
                context = found.context; usedSources = found.sources;
                usedSources.forEach(s => {
                    const a = document.createElement('a');
                    a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
                    a.textContent = '[' + s.n + '] ' + s.title;
                    sourcesEl.appendChild(a);
                });
                addLog(usedSources.length ? 'Изучено источников: ' + usedSources.length : 'Источники не найдены — отвечаю по истории и общим знаниям.');
            }

            // ШАГ 2: собираем сообщения: система + сводка + история + вопрос с источниками
            setStatus('🧠 СИНТЕЗ ОТВЕТА (с учётом ' + history.length + ' прошлых сообщений)...');
            const userContent = context
                ? 'ИСТОЧНИКИ ИЗ ИНТЕРНЕТА:\n' + context + '\n\nВОПРОС ПОЛЬЗОВАТЕЛЯ: ' + text
                : text;
            // Подсказка модели, что за тип сообщения — чтобы на приветствие
            // она отвечала «Привет!», а не лекцией из энциклопедии
            const intentHint = '\n\nТИП ТЕКУЩЕГО СООБЩЕНИЯ: ' + intent.type +
                (intent.type === 'greeting' || intent.type === 'chat' || intent.type === 'thanks' || intent.type === 'bye' || intent.type === 'ack'
                    ? '. Это обычное общение, а НЕ запрос информации: ответь коротко, тепло и естественно (на приветствие — просто поздоровайся и предложи помощь), не пересказывай энциклопедию и не выдумывай тему для лекции.'
                    : intent.type === 'reasoning'
                    ? '. Это загадка/задача на рассуждение: реши её сам, кратко объясни ход мысли, не ссылайся на отсутствующие источники.'
                    : intent.type === 'memory'
                    ? '. Пользователь спрашивает о нашем диалоге: отвечай ТОЛЬКО по истории и сводке выше.'
                    : '. Нужен фактический ответ; если даны источники — опирайся на них.') +
                (intent.greeting ? ' Сообщение началось с приветствия — сначала коротко поздоровайся, затем ответь на вопрос.' : '');
            const messages = [
                { role: 'system', content: SYSTEM_PROMPT + intentHint +
                    (summary ? '\n\nСВОДКА РАНЕЕ ОБСУЖДЁННОГО В ЭТОМ ДИАЛОГЕ:\n' + summary : '') },
                ...history.slice(-MAX_RECENT_TURNS * 2),
                { role: 'user', content: userContent }
            ];

            const finalAnswer = await callAI(messages, signal);

            content.textContent = finalAnswer;
            setStatus('✅ ГОТОВО' + (usedSources.length ? ' (' + usedSources.length + ' ИСТОЧНИКА)' : ' (ПО ПАМЯТИ ДИАЛОГА)'));
            addLog('Ответ сформирован.');

            // ШАГ 3: запоминаем реплику (в историю кладём чистый вопрос, без источников)
            history.push({ role: 'user', content: text }, { role: 'assistant', content: finalAnswer });
            saveMemory();
            await maybeSummarize(signal);
            updateMemoryStats();

        } catch (e) {
            const aborted = e.name === 'AbortError';
            content.textContent = aborted
                ? 'Остановлено. Запрос занял слишком много времени или ты нажал «Стоп». Попробуй ещё раз — я помню, о чём мы говорили.'
                : 'Ошибка: не удалось собрать данные или нейросеть занята. Попробуй ещё раз — история диалога не потерялась.';
            setStatus(aborted ? '⏹ ОСТАНОВЛЕНО' : '❌ ОШИБКА');
            addLog('ОШИБКА: ' + e.message);
            // Вопрос всё равно запоминаем, чтобы повторный запрос не терял контекст
            if (!aborted) { history.push({ role: 'user', content: text }); saveMemory(); }
        } finally {
            clearTimeout(timeout);
            btn.disabled = false;
            stopBtn.style.display = 'none';
            abortCtrl = null;
            chatEl.scrollTop = chatEl.scrollHeight;
            inp.focus();
        }
    }

    loadMemory();
    renderAll();
    </script>
