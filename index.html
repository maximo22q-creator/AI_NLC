<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя Собственная Нейросеть v1.0</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff41; margin: 0; display: flex; height: 100vh; }
        #left { flex: 1.5; display: flex; flex-direction: column; border-right: 1px solid #00ff41; }
        #right { flex: 1; padding: 20px; background: #000; overflow-y: auto; font-size: 12px; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin: 10px 0; padding: 10px; border: 1px solid #00ff41; border-radius: 5px; }
        .user { color: #00bfff; border-color: #00bfff; text-align: right; }
        #input-bar { padding: 20px; display: flex; gap: 10px; background: #000; }
        input { flex: 1; background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 10px; outline: none; }
        button { background: #00ff41; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .weight-box { display: inline-block; width: 10px; height: 10px; margin: 1px; }
    </style>
</head>
<body>

    <div id="left">
        <div id="chat">
            <div class="msg">СИСТЕМА: Нейросеть создана. Веса инициализированы случайно. Я ничего не знаю. Обучи меня (введи вопрос, я найду инфу и настрою свои нейроны).</div>
        </div>
        <div id="input-bar">
            <input type="text" id="userInput" placeholder="Введите команду или вопрос..." onkeydown="if(event.key==='Enter') process()">
            <button onclick="process()">ВЫПОЛНИТЬ</button>
        </div>
    </div>

    <div id="right">
        <h3>МАТРИЦА ВЕСОВ (ТВОИ НЕЙРОНЫ)</h3>
        <div id="viz"></div>
        <hr>
        <h3>ЛОГ ОБУЧЕНИЯ</h3>
        <div id="log"></div>
    </div>

    <script>
        // === ТВОЯ СОБСТВЕННАЯ НЕЙРОСЕТЕВАЯ МОДЕЛЬ ===
        class MyNeuralNetwork {
            constructor() {
                this.weights = {}; // Синаптические связи
                this.vocabulary = new Set();
                this.learningRate = 0.2; // Насколько сильно менять веса при ошибке
            }

            // Превращаем текст в массив токенов
            tokenize(text) {
                return text.toLowerCase().replace(/[^a-zа-яё0-9\s]/gi, '').split(/\s+/).filter(w => w.length > 0);
            }

            // Инициализация нейрона для нового слова
            initNeuron(word) {
                if (!this.weights[word]) {
                    this.weights[word] = {};
                    this.vocabulary.add(word);
                }
            }

            // ОБУЧЕНИЕ: Метод градиентного спуска (упрощенный)
            // ИИ смотрит на слово и пытается угадать следующее. Если не угадал - меняет веса.
            train(text) {
                const words = this.tokenize(text);
                let learningLog = "";

                for (let i = 0; i < words.length - 1; i++) {
                    const current = words[i];
                    const target = words[i + 1];

                    this.initNeuron(current);
                    this.initNeuron(target);

                    // Если связь слабая, усиливаем её (это и есть обучение)
                    if (!this.weights[current][target]) {
                        this.weights[current][target] = 0.1; 
                    }
                    
                    // Усиление веса (Математика: вес = вес + скорость_обучения)
                    this.weights[current][target] += this.learningRate;
                    
                    // Ослабляем другие связи этого нейрона (конкуренция нейронов)
                    for (let other in this.weights[current]) {
                        if (other !== target) {
                            this.weights[current][other] -= this.learningRate * 0.1;
                        }
                    }
                }
                return `Обработано ${words.length} токенов. Связей создано: ${Object.keys(this.weights).length}`;
            }

            // ГЕНЕРАЦИЯ: Проход по нейронной сети
            think(input) {
                const words = this.tokenize(input);
                let currentWord = words[words.length - 1];
                let result = [];
                let step = 0;

                while (step < 20) {
                    const connections = this.weights[currentWord];
                    if (!connections || Object.keys(connections).length === 0) break;

                    // Выбираем путь с наибольшим весом (самый сильный сигнал)
                    let bestWord = "";
                    let maxWeight = -Infinity;

                    for (let candidate in connections) {
                        if (connections[candidate] > maxWeight) {
                            maxWeight = connections[candidate];
                            bestWord = candidate;
                        }
                    }

                    if (!bestWord || result.includes(bestWord)) break; // Стоп если цикл или тупик
                    result.push(bestWord);
                    currentWord = bestWord;
                    step++;
                }

                return result.join(' ');
            }
        }

        const myAI = new MyNeuralNetwork();

        // ФУНКЦИЯ ДЛЯ ГРАФИЧЕСКОЙ ВИЗУАЛИЗАЦИИ НЕЙРОНОВ
        function drawNeurons() {
            const viz = document.getElementById('viz');
            viz.innerHTML = "";
            let count = 0;
            for (let word in myAI.weights) {
                if (count > 200) break; // Чтобы не лагало
                const span = document.createElement('div');
                span.className = 'weight-box';
                // Цвет зависит от количества связей нейрона
                const power = Object.keys(myAI.weights[word]).length;
                span.style.background = `rgb(0, ${Math.min(power * 20, 255)}, 0)`;
                viz.appendChild(span);
                count++;
            }
        }

        async function process() {
            const inp = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const log = document.getElementById('log');
            const text = inp.value.trim();
            if (!text) return;

            chat.innerHTML += `<div class="msg user">${text}</div>`;
            inp.value = '';

            const aiMsg = document.createElement('div');
            aiMsg.className = 'msg';
            aiMsg.innerText = '📡 СКАНИРОВАНИЕ И ОБУЧЕНИЕ...';
            chat.appendChild(aiMsg);

            try {
                // 1. ИИ идет в интернет за "сырьем" для обучения
                const res = await fetch(`https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(text)}&format=json&origin=*`);
                const data = await res.json();
                
                if (data.query.search.length > 0) {
                    const page = data.query.search[0];
                    const pRes = await fetch(`https://ru.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext&exintro&pageids=${page.pageid}&format=json&origin=*`);
                    const pData = await pRes.json();
                    const rawText = pData.query.pages[page.pageid].extract;

                    // 2. ОБУЧЕНИЕ ТВОЕЙ НЕЙРОСЕТИ
                    const stats = myAI.train(rawText);
                    myAI.train(text); // Учимся и на вопросе пользователя
                    
                    log.innerHTML = `<p>${stats}</p>` + log.innerHTML;
                    drawNeurons();

                    // 3. НЕЙРОСЕТЬ ВЫДАЕТ ОТВЕТ, ИСПОЛЬЗУЯ ВЕСА
                    const answer = myAI.think(text);
                    aiMsg.innerText = answer || "Я выучил это, но пока не могу построить фразу. Дай мне больше данных!";
                }
            } catch (e) {
                aiMsg.innerText = "ОШИБКА ДОСТУПА К ДАННЫМ.";
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
